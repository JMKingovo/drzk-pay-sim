  <!-- 右下角极速支付微标：深色外圈 + 翠绿底 + 纯白闪电 -->
  <circle cx="48" cy="48" r="13" fill="#0f172a" opacity="0.3"/>
  <circle cx="48" cy="48" r="12" fill="#059669"/>
  <!-- 白色闪电 -->
  <path d="M49 39 L42.5 48.5 H47.5 L46.5 56 L53.5 46.5 H48.5 Z" fill="#ffffff"/>
